name: LiftPlus
options:
  bundleIdPrefix: com.liftplus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: pt-BR
targets:
  LiftPlus:
    type: application
    platform: iOS
    sources:
      - LiftPlus
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lift+
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  LiftPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LiftPlusTests
    dependencies:
      - target: LiftPlus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiftPlus:
    build:
      targets:
        LiftPlus: all
    test:
      targets:
        - LiftPlusTests
