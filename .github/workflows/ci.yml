name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS)
    # macos-15 traz o Xcode 16, necessário para abrir o formato de projeto
    # gerado pelo XcodeGen atual. O deployment target continua iOS 17.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versões
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar ferramentas
        run: brew install xcodegen xcbeautify

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Escolher simulador
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9]+( Pro( Max)?)?' \
            | sort -V | tail -1)
          NAME=${NAME:-iPhone 16}
          echo "Simulador selecionado: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LiftPlus \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
