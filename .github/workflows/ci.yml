name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS)
    runs-on: macos-14
    env:
      # Combinação conhecida-boa: macos-14 + Xcode 15.4 traz o SDK do iOS 17.
      # Para atualizar, troque a versão do Xcode e o nome do simulador aqui.
      XCODE_VERSION: "15.4"
      SIMULATOR: "iPhone 15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Versões
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar ferramentas
        run: brew install xcodegen xcbeautify

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LiftPlus \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
